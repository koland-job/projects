name: project-4-ci

# Tests for project 4 (Bike Rental Finance System) on every push and pull request that touches it.
on:
  push:
    branches: [main]
    paths:
      - "project-4-bike-rental-finance-system/**"
      - ".github/workflows/project-4-ci.yml"
  pull_request:
    paths:
      - "project-4-bike-rental-finance-system/**"
      - ".github/workflows/project-4-ci.yml"

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: project-4-bike-rental-finance-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project-4-bike-rental-finance-system/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install the package with the dashboard and test dependencies
        run: pip install -e ".[dashboard,test]"
      - name: Python tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - name: Frontend and Apps Script tests
        run: node tests/test_frontend.cjs && node tests/test_apps_script.cjs
