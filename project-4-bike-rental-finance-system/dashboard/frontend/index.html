<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fleet Ledger — dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20640%20640%22%3E%3Crect%20width%3D%22640%22%20height%3D%22640%22%20rx%3D%22128%22%20fill%3D%22%23111%22/%3E%3Crect%20x%3D%22142%22%20y%3D%22330%22%20width%3D%2296%22%20height%3D%22168%22%20rx%3D%2216%22%20fill%3D%22%23fff%22/%3E%3Crect%20x%3D%22272%22%20y%3D%22238%22%20width%3D%2296%22%20height%3D%22260%22%20rx%3D%2216%22%20fill%3D%22%23fff%22/%3E%3Crect%20x%3D%22402%22%20y%3D%22142%22%20width%3D%2296%22%20height%3D%22356%22%20rx%3D%2216%22%20fill%3D%22%23fff%22/%3E%3C/svg%3E" />
<script>
  try {
    var t = localStorage.getItem("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="page">

  <div class="control-bar">
    <header class="topbar">
      <div class="topbar-title">
        <svg class="brand-logo" viewBox="0 0 640 640" width="32" height="32" role="img" aria-label="Fleet Ledger"><rect width="640" height="640" rx="128" fill="#111"/><rect x="142" y="330" width="96" height="168" rx="16" fill="#fff"/><rect x="272" y="238" width="96" height="260" rx="16" fill="#fff"/><rect x="402" y="142" width="96" height="356" rx="16" fill="#fff"/></svg>
        <h1>Fleet Ledger<span class="topbar-sub">dashboard</span></h1>
      </div>
      <div class="topbar-meta">
        <span id="demo-badge" class="demo-badge" title="Synthetic data generated for the demo; nothing here is real" hidden>Demo data</span>
        <span id="updated-line" class="ts-line" title=""></span>
        <button id="refresh-btn" class="icon-btn" type="button" aria-label="Refresh data">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 4v6h6M20 20v-6h-6M4.5 15a8 8 0 0 0 14.4 3M19.5 9A8 8 0 0 0 5.1 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle theme">
          <svg id="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"></svg>
        </button>
        <button id="logout-btn" class="icon-btn" type="button" aria-label="Sign out" title="Sign out" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <div class="control-row">
      <nav class="range-row" id="range-row" aria-label="Period"></nav>
      <select id="range-select" class="range-select" aria-label="Period"></select>
      <div class="fleet-widget" id="fleet-widget" aria-label="Fleet utilization"></div>
    </div>
  </div>

  <div id="error-banner" class="error-banner" hidden role="alert">
    <span id="error-text"></span>
    <button id="error-retry" class="error-retry" type="button">Retry</button>
  </div>

  <main>
    <section class="kpi-row" id="kpi-row" aria-label="Key figures"></section>

    <div class="charts-row">
    <section class="chart-card" id="period-chart-card">
      <div class="chart-card-head">
        <div>
          <h2 id="daily-chart-title">Revenue</h2>
          <p class="chart-sub" id="daily-chart-sub"></p>
        </div>
        <div class="compare-toggle" id="compare-toggle" role="group" aria-label="Compare with"></div>
      </div>
      <div class="chart-body chart-fill" id="daily-chart-body"></div>
    </section>

    <section class="chart-card" id="bike-card">
      <div class="chart-card-head">
        <div>
          <h2>Revenue by bike</h2>
          <p class="chart-sub" id="bike-chart-sub"></p>
        </div>
        <button class="table-toggle" id="bike-table-toggle" type="button">Show as table</button>
      </div>
      <div class="status-filter" id="status-filter" role="group" aria-label="Filter by status"></div>
      <div id="bike-insight" class="insight-note" hidden></div>
      <div class="bike-list-head">
        <span id="bike-count" class="bike-count"></span>
        <button class="sort-btn" id="bike-sort" type="button" aria-label="Sort order"></button>
      </div>

      <div id="bike-list-section" class="bike-scroll">
        <div class="bike-list" id="bike-list"></div>
      </div>

      <div class="table-wrap" id="bike-table-wrap" hidden>
        <table class="data-table" id="bike-table"></table>
      </div>
    </section>
    </div>
  </main>

</div>

<script src="api.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
