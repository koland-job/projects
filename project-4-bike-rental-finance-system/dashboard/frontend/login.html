<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fleet Ledger — sign in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20640%20640%22%3E%3Crect%20width%3D%22640%22%20height%3D%22640%22%20rx%3D%22128%22%20fill%3D%22%23111%22/%3E%3Crect%20x%3D%22142%22%20y%3D%22330%22%20width%3D%2296%22%20height%3D%22168%22%20rx%3D%2216%22%20fill%3D%22%23fff%22/%3E%3Crect%20x%3D%22272%22%20y%3D%22238%22%20width%3D%2296%22%20height%3D%22260%22%20rx%3D%2216%22%20fill%3D%22%23fff%22/%3E%3Crect%20x%3D%22402%22%20y%3D%22142%22%20width%3D%2296%22%20height%3D%22356%22%20rx%3D%2216%22%20fill%3D%22%23fff%22/%3E%3C/svg%3E" />
<script>
  try {
    var t = localStorage.getItem("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
<link rel="stylesheet" href="styles.css" />
</head>
<body class="login-body">
<main class="login-wrap">
  <form class="login-card" id="login-form" novalidate>
    <div class="login-brand">
      <svg class="brand-logo" viewBox="0 0 640 640" width="40" height="40" aria-hidden="true"><rect width="640" height="640" rx="128" fill="#111"/><rect x="142" y="330" width="96" height="168" rx="16" fill="#fff"/><rect x="272" y="238" width="96" height="260" rx="16" fill="#fff"/><rect x="402" y="142" width="96" height="356" rx="16" fill="#fff"/></svg>
      <div>
        <h1 class="login-title">Sign in to the dashboard</h1>
        <p class="login-sub">Fleet Ledger — rental finance</p>
      </div>
    </div>

    <label class="login-field">
      <span class="login-label">Username</span>
      <input id="login-user" name="username" type="text" autocomplete="username"
             autocapitalize="none" spellcheck="false" required autofocus />
    </label>

    <label class="login-field">
      <span class="login-label">Password</span>
      <span class="login-password">
        <input id="login-password" name="password" type="password" autocomplete="current-password" required />
        <button type="button" class="login-reveal" id="login-reveal" aria-label="Show password" aria-pressed="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
      </span>
    </label>

    <p class="login-error" id="login-error" role="alert" aria-live="assertive" hidden></p>

    <button class="login-submit" id="login-submit" type="submit">Sign in</button>
    <p class="login-hint">You stay signed in on this device for 180 days.</p>
  </form>
</main>
<script src="login.js"></script>
</body>
</html>
